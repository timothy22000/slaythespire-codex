[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sts-cards"
version = "0.4.0"
description = "Slay the Spire 1 + 2 card dataset and embedding pipeline"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "timothy22000" }]
keywords = ["slay-the-spire", "card-game", "embeddings", "dataset", "huggingface"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "requests>=2.32",
    "requests-cache>=1.2",
    "tenacity>=8.2",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "tqdm>=4.66",
    "typer>=0.12",
]

[project.optional-dependencies]
embed = [
    "sentence-transformers>=2.7.0",
    "transformers>=4.51.0",
    "torch>=2.1",
]
viz = [
    "umap-learn>=0.5.6",
    "plotly>=5.20",
]
upload = [
    "huggingface_hub>=0.23",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "Pillow>=10.0",
]
all = [
    "sts-cards[embed,viz,upload,dev]",
]

[project.scripts]
sts-cards = "sts_cards.cli:app"

[project.urls]
Homepage = "https://github.com/timothy22000/slaythespire-codex"
Repository = "https://github.com/timothy22000/slaythespire-codex"
"STS1 Dataset" = "https://huggingface.co/datasets/t22000t/slay-the-spire-1-cards"
"STS2 Dataset" = "https://huggingface.co/datasets/t22000t/slay-the-spire-2-cards"

[tool.hatch.build.targets.wheel]
packages = ["src/sts_cards"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "network: tests that hit the real spire-archive API (skipped by default)",
    "model: tests that load an embedding model (skipped by default)",
]
